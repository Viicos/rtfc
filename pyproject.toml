[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtfc"
version = "0.1.0"
authors = [
    {name = "Victorien", email = "contact@vctrn.dev"}
]
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "tomli-w>=1.2.0",
    "typing-extensions>=4.16.0",
]

[project.scripts]
rtfc = "rtfc._cli:main"

[dependency-groups]
dev = [
    "pyright",
    "pytest>=9.1.0",
    "ruff",
    "tox>=4.25.0",
    "tox-gh>=1.5.0",
    "tox-uv>=1.25.0",
]
docs = [
    "furo",
    "sphinx",
    "sphinx-argparse>=0.6.0",
    "sphinx-autobuild",
    "sphinx-inline-tabs>=2025.12.21.14",
    "sphinx-issues",
    "sphinx-lint",
]
build = [
    "build",
    "twine",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rtfc"]

[tool.uv]
default-groups = ["dev", "docs"]
required-version = ">=0.12.0"

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle (E)
    "W",      # pycodestyle (W)
    "F",      # Pyflakes
    "UP",     # pyupgrade
    "I",      # isort
    "PL",     # Pylint
    "RUF",    # Ruff
    "YTT",    # flake8-2020
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "T10",    # flake8-debugger
    "FA",     # flake8-future-annotations
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "RSE",    # flake8-raise
    "PTH",    # flake8-use-pathlib
]
ignore = [
    "PLR2004",
    "PLR0911",
]

[tool.ruff.lint.per-file-ignores]
"src/rtfc/_cli.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["rtfc"]

[tool.pytest]
testpaths = ["tests"]
strict = true

[tool.rtfc]
changelog = "docs/source/changelog.rst"
[tool.rtfc.render]
entry_template_file = "changelog/entry.rst.jinja"
[tool.rtfc.metadata]
gh_issue = {type = "integer"}
gh_pr = {type = "integer"}

[tool.tox]
requires = ["tox>=4.21"]
env_list = ["py311", "py312", "py313", "py314", "py315"]

[tool.tox.env_run_base]
description = "Run test under {base_python}"
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
uv_python_preference = "only-managed"
uv_sync_flags = ["--no-python-downloads"]
commands = [["pytest"]]

[tool.tox.gh.python]
"3.11" = ["py311"]
"3.12" = ["py312"]
"3.13" = ["py313"]
"3.14" = ["py314"]
"3.15" = ["py315"]
